[workspace]
members = ["native/zlib", "kernels/room", "kernels/stream35", "kernels/microcode11", "kernels/microcode4", "kernels/microcode7", "kernels/stack5", "kernels/stack8"]

[package]
name = "lumen-lang"
version = "0.2.0"
edition = "2021"
description = "Lumen: one command-line host, six independent interpreter kernels"

[[bin]]
name = "lumen-lang"
path = "src/main.rs"

[dependencies]
serde_json = "1"
lumen-room = { path = "kernels/room" }
lumen-stream35 = { path = "kernels/stream35" }
lumen-microcode11 = { path = "kernels/microcode11" }
lumen-microcode4 = { path = "kernels/microcode4" }
lumen-stack5 = { path = "kernels/stack5" }
lumen-stack8 = { path = "kernels/stack8" }
lumen-microcode7 = { path = "kernels/microcode7" }

[build-dependencies]
serde_json = "1"

# The two full kernels carry the interpreter's hot loops; a light
# optimization of those crates alone keeps the debug assertions and the
# ordinary `cargo build` while letting the language tests finish.
[profile.dev.package.lumen-stack8]
opt-level = 1
debug = false

[profile.dev.package.lumen-microcode7]
opt-level = 1
debug = false
