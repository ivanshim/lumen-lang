[workspace]
members = ["kernels/stream35", "kernels/microcode10", "kernels/stack26", "kernels/microcode11", "kernels/microcode4", "kernels/stack5", "lab/stacklab", "lab/microlab"]

[package]
name = "lumen-lang"
version = "0.2.0"
edition = "2021"
description = "Lumen: one command-line host, six independent interpreter kernels"

[[bin]]
name = "lumen-lang"
path = "src/main.rs"

[dependencies]
lumen-stream35 = { path = "kernels/stream35" }
lumen-microcode10 = { path = "kernels/microcode10" }
lumen-stack26 = { path = "kernels/stack26" }
lumen-microcode11 = { path = "kernels/microcode11" }
lumen-microcode4 = { path = "kernels/microcode4" }
lumen-stack5 = { path = "kernels/stack5" }
