[package]
name = "lumen-stack8"
version = "0.1.0"
edition = "2021"
description = "Stack kernel, third design: eight words, three of them fused for speed"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = "1"
lumen-room = { path = "../room" }

md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2b_simd = "1"
blake2s_simd = "1"
base64 = "0.22"
constant_time_eq = "0.4"

[lib]
path = "src/lib.rs"
