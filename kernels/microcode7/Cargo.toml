[package]
name = "lumen-microcode7"
version = "0.2.0"
edition = "2021"
description = "Microcode kernel, fourth design: seven forms, three of them for speed"

[lib]
path = "src/lib.rs"

[dependencies]
lumen-zlib = { path = "../../native/zlib" }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = "1"
lumen-room = { path = "../room" }

md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2b_simd = "1"
blake2s_simd = "1"
base64 = "0.22"
constant_time_eq = "0.4"
