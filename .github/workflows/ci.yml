name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Kernel independence
        run: python3 scripts/kernel_independence.py
      - name: Build (warnings are errors)
        run: |
          cargo build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
        env:
          RUSTFLAGS: -D warnings
      - name: Ported examples and library mirrors are current
        run: |
          python3 scripts/port_examples.py
          git diff --exit-code --stat -- examples langs/lib_* docs/LIBRARY_PORTS.md
      - name: Test all languages on every kernel
        run: |
          TEST_QUIET=1 ./test.sh --lang all 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PHP CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Build reference suites
        run: |
          cargo build --release
      - name: Run reference suites
        run: |
          python3 scripts/reference_tests.py 2>&1 | tee reference.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check kernel disagreements
        run: |
          test "$(grep -c 'Kernel disagreements' tests/REPORT.md)" -eq 0
      - name: Check reference regressions
        run: |
          set +e
          git diff tests/REPORT.md | grep -E '^-.*\| pass \| pass \|'
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 0
          test "${statuses[1]}" -eq 1
      - name: Summarize reference results
        if: always()
        run: |
          {
            echo '```markdown'
            grep -E '^\| all \||^\| `python` \|' tests/REPORT.md
            echo ''
            sed -n '/^## Python:/,/^### Reserved words/{
              /^## Python:/d
              /^### Reserved words/d
              p
            }' tests/REPORT.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report
          path: |
            tests/REPORT.md
            reference.log
          if-no-files-found: ignore

  scratch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build scratch programs
        run: |
          cargo build --release
      - name: Run scratch programs on both full kernels
        shell: bash
        run: |
          shopt -s nullglob
          programs=(scratch/*/*.py)
          if [ "${#programs[@]}" -eq 0 ]; then
            echo 'No scratch programs found; scratch/ is absent or empty.'
            exit 0
          fi
          mapfile -d '' -t programs < <(printf '%s\0' "${programs[@]}" | LC_ALL=C sort -z)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          failures=0
          for f in "${programs[@]}"; do
            for kernel in stack8 microcode7; do
              printf '\n=== %s (%s) ===\n' "$f" "$kernel"
              status=0
              target/release/lumen-lang --kernel "$kernel" "$f" </dev/null >"$tmp/stdout" 2>"$tmp/stderr" || status=$?
              printf '%s\n' '--- stdout ---'
              cat "$tmp/stdout"
              printf '\n%s\n' '--- stderr ---'
              cat "$tmp/stderr"
              printf '\nExit status: %s\n' "$status"
              failed=0
              if [ -f "${f%.py}.out" ]; then
                if [ "$status" -ne 0 ]; then
                  echo 'Expected a successful exit.'
                  failed=1
                fi
                if ! diff -u "${f%.py}.out" "$tmp/stdout"; then
                  failed=1
                fi
              elif [ -f "${f%.py}.err" ]; then
                if [ "$status" -eq 0 ]; then
                  echo 'Expected a non-zero exit.'
                  failed=1
                fi
                head -n 1 "${f%.py}.err" >"$tmp/expected-error"
                head -n 1 "$tmp/stderr" >"$tmp/actual-error"
                if ! diff -u "$tmp/expected-error" "$tmp/actual-error"; then
                  failed=1
                fi
              else
                echo 'Missing expected .out or .err file.'
                failed=1
              fi
              failures=$((failures + failed))
            done
          done
          echo "Scratch failures: $failures"
          test "$failures" -eq 0
