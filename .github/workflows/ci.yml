name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Kernel independence
        run: python3 scripts/kernel_independence.py
      - name: Build (warnings are errors)
        run: |
          cargo build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
        env:
          RUSTFLAGS: -D warnings
      - name: Ported examples are current
        run: |
          python3 scripts/port_examples.py
          git diff --exit-code --stat -- examples
      - name: Test all languages on both kernels
        run: |
          TEST_QUIET=1 ./test.sh --lang all 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
