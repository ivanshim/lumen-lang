name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (warnings are errors)
        run: cargo build --locked 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0
        env:
          RUSTFLAGS: -D warnings
      - name: Test all languages on both kernels
        run: TEST_LOGGING=1 ./test.sh --lang all
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
